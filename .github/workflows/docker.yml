name: docker
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        variant: ['bookworm', 'trixie', 'slim-bookworm', 'slim-trixie']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
            PYTHON_VARIANT=${{ matrix.variant }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gql-personalities:${{ matrix.python-version }}-${{ matrix.variant }}
            ${{ (matrix.python-version == '3.12' && matrix.variant == 'slim-bookworm') && format('{0}/gql-personalities:latest', secrets.DOCKER_USERNAME) || '' }}
